name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Autenticar en DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Paso 3: Construir la imagen de Docker
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/desarrollo-claude-native-s3:latest .

      # Paso 4: Hacer push de la imagen a DockerHub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/desarrollo-claude-native-s3:latest

      # Paso 5: Configurar credenciales de AWS para SSH, incluyendo AWS_SESSION_TOKEN
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1   # Cambia a tu region
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # Paso 5.5: Agregar la llave SSH
      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Paso 6: Conectarse a EC2 y desplegar backend + RabbitMQ + PostgreSQL (Semana 8)
      - name: SSH commands to deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            # Autenticar en DockerHub desde EC2
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # --- Red Docker compartida: los 3 contenedores se ven por nombre ---
            docker network create guias-net || true

            # --- RabbitMQ (Semana 8): solo se crea si no existe (no se reinicia en cada deploy) ---
            if [ -z "$(docker ps -q -f name=^rabbitmq$)" ]; then
              docker rm -f rabbitmq || true
              docker run -d --name rabbitmq --network guias-net \
                -e RABBITMQ_DEFAULT_USER=guest -e RABBITMQ_DEFAULT_PASS=guest \
                -p 5672:5672 -p 15672:15672 \
                rabbitmq:3-management
            fi

            # --- PostgreSQL (Semana 8): solo se crea si no existe (conserva los datos) ---
            if [ -z "$(docker ps -q -f name=^postgres-guias$)" ]; then
              docker rm -f postgres-guias || true
              docker run -d --name postgres-guias --network guias-net \
                -e POSTGRES_DB=guiasdb -e POSTGRES_USER=guias -e POSTGRES_PASSWORD=guias123 \
                -v pgdata:/var/lib/postgresql/data \
                -p 5433:5432 \
                postgres:16
            fi

            # --- Backend: se reemplaza en cada deploy ---
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/desarrollo-claude-native-s3:latest
            docker stop desarrollo-claude-native-s3 || true && docker rm desarrollo-claude-native-s3 || true
            # Se conecta a rabbitmq y postgres por su NOMBRE de contenedor (misma red guias-net).
            # Perfil "postgres" para que use PostgreSQL (tabla de eventos de la cola).
            docker run -d --name desarrollo-claude-native-s3 --network guias-net \
              -v /mnt/efs:/app/efs \
              -e EFS_PATH=/app/efs \
              -e SPRING_PROFILES_ACTIVE=postgres \
              -e DB_URL=jdbc:postgresql://postgres-guias:5432/guiasdb \
              -e DB_USER=guias \
              -e DB_PASSWORD=guias123 \
              -e RABBITMQ_HOST=rabbitmq \
              -e S3_BUCKET=${{ secrets.S3_BUCKET }} \
              -e AWS_REGION=us-east-1 \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }} \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/desarrollo-claude-native-s3:latest
          EOF
