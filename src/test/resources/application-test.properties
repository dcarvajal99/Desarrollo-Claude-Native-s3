# Configuracion para los tests de contexto (perfil "test").
# No se contacta Azure: el JwtDecoder real se reemplaza por un mock en TestSecurityConfig.
# Igual definimos un issuer-uri ficticio para que @Value no falle al resolverse.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test-issuer.local/v2.0
app.oauth2.audience=test-audience
