# Perfil "postgres" (Semana 8): usa PostgreSQL en lugar de H2.
# Se activa con -Dspring.profiles.active=postgres o SPRING_PROFILES_ACTIVE=postgres.
# Postgres corre en un contenedor Docker (docker-compose.yml). En la EC2 se pasan
# host/usuario/pass como variables de entorno.
#
# Nota: la tabla nueva del consumidor (eventos_guia) queda en esta base Postgres,
# separada de las tablas usadas en las sumativas anteriores. Reemplaza a Oracle
# Cloud / RDS (que AWS Academy no permite crear).

# En local el contenedor expone Postgres en el puerto 5433 del host.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/guiasdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:guias}
spring.datasource.password=${DB_PASSWORD:guias123}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# PostgreSQL PERSISTE los datos (a diferencia de H2 en memoria). Como data.sql corre
# en cada arranque, los INSERT de las guias demo fallarian con "duplicate key" en el
# segundo arranque. continue-on-error=true hace que esos duplicados se ignoren en vez
# de abortar el inicio de la aplicacion.
spring.sql.init.continue-on-error=true

# La consola H2 no aplica con Postgres.
spring.h2.console.enabled=false
