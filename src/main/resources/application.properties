spring.application.name=Desarrollo-Claude-Native-s3

# --- Datasource H2 (memoria) ---
spring.datasource.url=jdbc:h2:mem:guias;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web H2 en /h2-console (JDBC URL: jdbc:h2:mem:guias, user: sa, sin pass)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# data.sql corre DESPUES de que Hibernate crea el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Desarrollo-Claude-Native-s3
info.app.description=Sistema de Gestion de Guias de Despacho - Semana 3 CDY2204
info.app.version=1.0.1

# --- Jackson (serializacion JSON) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# --- Tamano maximo de archivos subidos (descarga/subida de guias) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================================
#  Almacenamiento Cloud
# =========================================================================
# --- EFS: carpeta temporal donde se escriben las guias generadas ---
# En la EC2 el disco EFS se monta en /mnt/efs y se inyecta al contenedor
# Docker con  -v /mnt/efs:/app/efs , por lo que dentro del contenedor la ruta
# es /app/efs. En desarrollo local cae a ./efs-local (ver el valor por defecto).
app.efs.path=${EFS_PATH:./efs-local}

# --- AWS S3: bucket y region donde se publican las guias ---
# Las credenciales NO se ponen aqui: el SDK usa DefaultCredentialsProvider
# (variables de entorno / instance profile / ~/.aws/credentials), compatible
# con las credenciales temporales de AWS Academy.
app.s3.bucket=${S3_BUCKET:guias-despacho-duoc}
app.s3.region=${AWS_REGION:us-east-1}
# Permite forzar un endpoint distinto (util para tests con S3 simulado). Vacio = AWS real.
app.s3.endpoint=${S3_ENDPOINT:}

# =========================================================================
#  Seguridad - OAuth2 Resource Server (Azure AD / IDaaS)  -- Semana 5
# =========================================================================
# Issuer (claim iss del token): servidor que emite y firma los JWT. Spring usa este
# valor para descubrir las claves publicas de Azure y validar la firma de cada token.
# IMPORTANTE: debe coincidir EXACTO con el campo "iss" del token (ver en jwt.ms).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:https://login.microsoftonline.com/23369869-d28c-4ace-89dd-d87bf705f9c3/v2.0}

# Audiencia esperada (claim aud = Client ID de la API registrada en Azure).
# Si se deja vacio, NO se valida la audiencia (solo issuer + firma + expiracion).
app.oauth2.audience=${OAUTH2_AUDIENCE:54a7a174-e59c-468e-a9f8-d821e51a900c}

# --- Logging ---
logging.level.com.duoc.guias=DEBUG
logging.level.org.springframework.security=INFO
