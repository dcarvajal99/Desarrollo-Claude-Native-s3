spring.application.name=Desarrollo-Claude-Native-s3

# --- Datasource H2 (memoria) ---
spring.datasource.url=jdbc:h2:mem:guias;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web H2 en /h2-console (JDBC URL: jdbc:h2:mem:guias, user: sa, sin pass)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# data.sql corre DESPUES de que Hibernate crea el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Desarrollo-Claude-Native-s3
info.app.description=Sistema de Gestion de Guias de Despacho - Semana 3 CDY2204
info.app.version=1.0.1

# --- Jackson (serializacion JSON) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# --- Tamano maximo de archivos subidos (descarga/subida de guias) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================================
#  Almacenamiento Cloud
# =========================================================================
# --- EFS: carpeta temporal donde se escriben las guias generadas ---
# En la EC2 el disco EFS se monta en /mnt/efs y se inyecta al contenedor
# Docker con  -v /mnt/efs:/app/efs , por lo que dentro del contenedor la ruta
# es /app/efs. En desarrollo local cae a ./efs-local (ver el valor por defecto).
app.efs.path=${EFS_PATH:./efs-local}

# --- AWS S3: bucket y region donde se publican las guias ---
# Las credenciales NO se ponen aqui: el SDK usa DefaultCredentialsProvider
# (variables de entorno / instance profile / ~/.aws/credentials), compatible
# con las credenciales temporales de AWS Academy.
app.s3.bucket=${S3_BUCKET:guias-despacho-duoc}
app.s3.region=${AWS_REGION:us-east-1}
# Permite forzar un endpoint distinto (util para tests con S3 simulado). Vacio = AWS real.
app.s3.endpoint=${S3_ENDPOINT:}

# =========================================================================
#  Seguridad / JWT
# =========================================================================
# Clave de firma HS512 (minimo 64 bytes). En produccion se pasa por variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ClaveSecretaSeguraParaJWTHS512MinimoCuarentaCaracteresGuiasDespachoCDY2204Duoc2026}
# Duracion del token en milisegundos (86400000 = 24 horas)
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Logging ---
logging.level.com.duoc.guias=DEBUG
logging.level.org.springframework.security=INFO
