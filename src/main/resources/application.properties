spring.application.name=Desarrollo-Claude-Native-s3

# --- Datasource H2 (memoria) ---
spring.datasource.url=jdbc:h2:mem:guias;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web H2 en /h2-console (JDBC URL: jdbc:h2:mem:guias, user: sa, sin pass)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# data.sql corre DESPUES de que Hibernate crea el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Desarrollo-Claude-Native-s3
info.app.description=Sistema de Gestion de Guias de Despacho - Semana 3 CDY2204
info.app.version=1.0.1

# --- Jackson (serializacion JSON) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# --- Tamano maximo de archivos subidos (descarga/subida de guias) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================================
#  Almacenamiento Cloud
# =========================================================================
# --- EFS: carpeta temporal donde se escriben las guias generadas ---
# En la EC2 el disco EFS se monta en /mnt/efs y se inyecta al contenedor
# Docker con  -v /mnt/efs:/app/efs , por lo que dentro del contenedor la ruta
# es /app/efs. En desarrollo local cae a ./efs-local (ver el valor por defecto).
app.efs.path=${EFS_PATH:./efs-local}

# --- AWS S3: bucket y region donde se publican las guias ---
# Las credenciales NO se ponen aqui: el SDK usa DefaultCredentialsProvider
# (variables de entorno / instance profile / ~/.aws/credentials), compatible
# con las credenciales temporales de AWS Academy.
app.s3.bucket=${S3_BUCKET:guias-despacho-duoc}
app.s3.region=${AWS_REGION:us-east-1}
# Permite forzar un endpoint distinto (util para tests con S3 simulado). Vacio = AWS real.
app.s3.endpoint=${S3_ENDPOINT:}

# =========================================================================
#  Seguridad - OAuth2 Resource Server + ROLES (Azure AD B2C / IDaaS) -- Semana 6
# =========================================================================
# Issuer (claim iss del token). En B2C debe coincidir EXACTO con el "iss" del token,
# INCLUIDO el "/" final (ver en jwt.ms). Tenant B2C: duoc2026grp2.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:https://duoc2026grp2.b2clogin.com/23369869-d28c-4ace-89dd-d87bf705f9c3/v2.0/}

# jwks_uri: URI con las claves publicas para validar la firma del JWT. En B2C conviene
# darla explicitamente (el descubrimiento por issuer no siempre funciona). El nombre del
# User Flow (tfp del token) es B2C_1_registro_login.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWKS_URI:https://duoc2026grp2.b2clogin.com/duoc2026grp2.onmicrosoft.com/B2C_1_registro_login/discovery/v2.0/keys}

# Audiencia esperada (claim aud = Client ID de la API registrada en Azure).
# Si se deja vacio, NO se valida la audiencia (solo issuer + firma + expiracion).
app.oauth2.audience=${OAUTH2_AUDIENCE:54a7a174-e59c-468e-a9f8-d821e51a900c}

# --- Roles (custom claims de Azure B2C) ---
# Claim que trae el ROL del usuario (autorizacion). Valores esperados: descarga | gestion.
app.oauth2.role-claim=${OAUTH2_ROLE_CLAIM:extension_consultaRole}
app.oauth2.role-descarga=${OAUTH2_ROLE_DESCARGA:descarga}
app.oauth2.role-gestion=${OAUTH2_ROLE_GESTION:gestion}

# Claim que trae el NOMBRE DEL TRANSPORTISTA (identidad de negocio = dueño de la guia).
# Se crea en Azure B2C como custom attribute "nombreTransportista" -> llega como
# "extension_nombreTransportista". Se usa para validar quien descarga su propia guia.
app.oauth2.transportista-claim=${OAUTH2_TRANSPORTISTA_CLAIM:extension_nombreTransportista}

# --- Logging ---
logging.level.com.duoc.guias=DEBUG
logging.level.org.springframework.security=INFO
